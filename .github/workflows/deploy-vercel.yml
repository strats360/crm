name: Deploy to Vercel

on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_API_KEY }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "prod=${{ inputs.environment == 'production' }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/release" ]; then
            echo "prod=true" >> $GITHUB_OUTPUT
          else
            echo "prod=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel Environment (Production)
        if: steps.env.outputs.prod == 'true'
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Pull Vercel Environment (Preview)
        if: steps.env.outputs.prod != 'true'
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build (Production)
        if: steps.env.outputs.prod == 'true'
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Build (Preview)
        if: steps.env.outputs.prod != 'true'
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy (Production)
        if: steps.env.outputs.prod == 'true'
        id: deploy-prod
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🚀 Production deployed to: $URL"

      - name: Deploy (Preview)
        if: steps.env.outputs.prod != 'true'
        id: deploy-preview
        run: |
          URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🚀 Preview deployed to: $URL"

      - name: Summary
        run: |
          URL="${{ steps.deploy-prod.outputs.url || steps.deploy-preview.outputs.url }}"
          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.prod == 'true' && 'Production' || 'Preview' }}" >> $GITHUB_STEP_SUMMARY
